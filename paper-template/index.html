<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="description" content="{{PAPER_TITLE}} - Omni Language AI Research">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{PAPER_TITLE}} | OLAResearch</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Castoro:ital@0;1&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
  <link rel="stylesheet" href="../static/css/index.css">
  <link rel="icon" href="../images/logos/olar.svg">
  <style>
    @media (max-width: 768px) {
      .navbar-menu {
        display: flex !important;
        gap: 1.5rem;
      }
    }
  </style>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-5LHSMW4F3Y"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-5LHSMW4F3Y');
  </script>
</head>
<body>

<nav class="navbar" role="navigation">
  <div class="navbar-brand">
    <a class="navbar-item" href="../index.html">
      <img src="../images/logos/olar.svg" alt="OLAR Home" style="height: 2rem;">
    </a>
</div>
  <div class="navbar-menu">
    <a class="navbar-item" href="../publications.html">Back to Publications</a>
  </div>
</nav>

<header class="paper-hero">
  <h1 class="title is-1 paper-title-small">{{PAPER_TITLE}}</h1>
  
  <div class="paper-meta">
    <div class="meta-item">
      <span class="meta-label">Authors</span>
      <span class="meta-value">{{AUTHORS}}</span>
    </div>
    <div class="meta-item">
      <span class="meta-label">Venue</span>
      <span class="meta-value">{{VENUE}}</span>
    </div>
    <div class="meta-item">
      <span class="meta-label">Date</span>
      <span class="meta-value">{{PUBLICATION_DATE}}</span>
    </div>
  </div>
  
  <div class="action-buttons">
    <a href="{{PDF_URL}}" class="btn-primary" target="_blank">Download PDF</a>
    <a href="{{EXTERNAL_URL}}" class="btn-secondary" target="_blank">Official Link</a>
  </div>

  <div class="hero-links-container is-centered">
    <div class="hero-affiliations">
      <a href="https://turkunlp.org" target="_blank"><img src="../images/logos/turkunlp.png" alt="TurkuNLP" class="hero-affiliation-logo"></a>
      <a href="https://www.ellisinstitute.fi" target="_blank"><img src="../images/logos/ellis-logo_horizontal_black_2023-FINLAND.png" alt="ELLIS" class="hero-affiliation-logo"></a>
      <a href="https://www.utu.fi/en" target="_blank"><img src="../images/logos/UTU_logo_EN_RGB.png" alt="UTU" class="hero-affiliation-logo"></a>
    </div>
  </div>
</header>

<main class="paper-content">
  <h3 class="title is-3" style="font-size: 1.5rem; margin-bottom: 2rem;">Abstract</h3>
  <p class="abstract-small">
    {{ABSTRACT}}
  </p>

  <section id="bibtex" style="margin-top: 6rem;">
    <h3 class="title is-3" style="font-size: 1.5rem; margin-bottom: 2rem;">BibTeX</h3>
    <div class="bibtex-container">
      <button class="copy-button" onclick="copyBibTeX()">Copy</button>
      <pre id="bibtex-code" style="margin: 0; color: var(--text-primary); font-family: 'Courier New', monospace; font-size: 0.85rem;"><code style="color: var(--text-primary); background: transparent;">{{BIBTEX}}</code></pre>
    </div>
  </section>
</main>

<footer class="footer">
  <div>&copy; 2026 Omni Language AI Research.</div>
  <div class="footer-logo-container">
    <a href="https://turkunlp.org" target="_blank"><img src="../images/logos/turkunlp.png" alt="TurkuNLP" class="footer-logo" title="TurkuNLP"></a>
    <a href="https://www.ellisinstitute.fi" target="_blank"><img src="../images/logos/ellis-logo_horizontal_black_2023-FINLAND.png" alt="ELLIS Institute Finland" class="footer-logo" title="ELLIS Institute Finland"></a>
    <a href="https://www.utu.fi/en" target="_blank"><img src="../images/logos/UTU_logo_EN_RGB.png" alt="University of Turku" class="footer-logo" title="University of Turku"></a>
  </div>
  <a href="https://github.com/OLAResearch" style="color: inherit; font-size: 1.5rem; transition: var(--transition-smooth);"><i class="fab fa-github"></i></a>
</footer>

<script src="../static/js/main.js"></script>

</body>
</html>
