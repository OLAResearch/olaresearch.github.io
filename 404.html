<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 Not Found - Omni Language AI Research</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Castoro:ital@0;1&family=Inter:wght@300;400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
  <link rel="stylesheet" href="./static/css/index.css">
  <link rel="icon" href="./images/logos/olar.svg">

  <style>
    .not-found-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 65vh;
      text-align: center;
      padding: 4rem 2rem;
    }

    .not-found-title {
      font-family: var(--font-serif, 'Castoro', serif);
      font-size: 8rem;
      font-weight: 700;
      color: var(--text-primary, #1d1d1f);
      margin-bottom: 1rem;
      line-height: 1;
    }

    .not-found-subtitle {
      font-family: var(--font-sans, 'Inter', sans-serif);
      font-size: 1.5rem;
      color: var(--text-secondary, #86868b);
      margin-bottom: 2.5rem;
    }

    .btn-primary {
      display: inline-block;
      padding: 0.8rem 2rem;
      background-color: var(--text-primary, #1d1d1f);
      color: #ffffff;
      text-decoration: none;
      border-radius: 4px;
      font-family: var(--font-sans, 'Inter', sans-serif);
      font-weight: 500;
      transition: background-color 0.3s ease;
    }

    .btn-primary:hover {
      background-color: var(--accent-earth, #8b7355);
      color: #ffffff;
    }
    
    /* Mobile Navigation Override */
    .navbar-burger {
      display: none;
    }

    @media (max-width: 768px) {
      .navbar-brand {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
      }

      .navbar-burger {
        display: block;
        background: none;
        border: none;
        color: var(--text-primary);
        font-size: 1.5rem;
        cursor: pointer;
        padding: 0.5rem;
        outline: none;
        transition: color 0.3s ease;
      }

      .navbar-burger:hover {
        color: var(--accent-earth);
      }

      .navbar-menu {
        display: none;
        flex-direction: column;
        width: 100%;
        position: absolute;
        top: 100%;
        left: 0;
        background: rgba(253, 252, 249, 0.98);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--border-color);
        padding: 1.5rem 4vw;
        gap: 1.5rem;
        box-shadow: 0 10px 15px rgba(0, 0, 0, 0.05);
      }

      .navbar-menu.is-active {
        display: flex !important;
      }
    }
  </style>
</head>

<body>

  <nav class="navbar" role="navigation">
    <div class="navbar-brand">
      <a class="navbar-item" href="index.html">
        <img src="./images/logos/olar.svg" alt="OLAR Home" style="height: 2rem;">
      </a>
      <button class="navbar-burger" aria-label="toggle navigation">
        <i class="fas fa-bars"></i>
      </button>
    </div>
    <div class="navbar-menu">
      <a class="navbar-item" href="about.html">About</a>
      <a class="navbar-item" href="index.html#projects">Projects</a>
      <a class="navbar-item" href="index.html#papers">Publications</a>
      <a class="navbar-item" href="index.html#people">People</a>
      <a class="navbar-item" href="seminar/index.html">Seminars</a>
      <a class="navbar-item" href="news/index.html">News</a>
    </div>
  </nav>

  <section class="section">
    <div class="container not-found-container">
      <h1 class="not-found-title">404</h1>
      <p class="not-found-subtitle">Oops! The page you're looking for doesn't exist or has been moved.</p>
      <a href="index.html" class="btn-primary">Return to Homepage</a>
    </div>
  </section>

  <footer class="footer">
    <div>&copy; 2026 Omni Language AI Research.</div>
    <div class="footer-logo-container">
      <a href="https://turkunlp.org" target="_blank"><img src="images/logos/turkunlp.png" alt="TurkuNLP"
          class="footer-logo" title="TurkuNLP"></a>
      <a href="https://www.ellisinstitute.fi" target="_blank"><img
          src="images/logos/ellis-logo_horizontal_black_2023-FINLAND.png" alt="ELLIS Institute Finland"
          class="footer-logo" title="ELLIS Institute Finland"></a>
      <a href="https://www.utu.fi/en" target="_blank"><img src="images/logos/UTU_logo_EN_RGB.png"
          alt="University of Turku" class="footer-logo" title="University of Turku"></a>
    </div>
    <a href="https://github.com/OLAResearch"
      style="color: inherit; font-size: 1.5rem; transition: color 0.3s ease;"><i class="fab fa-github"></i></a>
  </footer>

  <script src="./static/js/main.js"></script>
</body>

</html>
